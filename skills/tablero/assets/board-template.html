<!doctype html>
<html lang="__DEPA_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depa pa la Banda</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--mute:#666;--line:#ddd;--accent:#2b6cb0;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--card:#2a2a2d;--ink:#eee;--mute:#aaa;--line:#444;--accent:#63b3ed;--warn:#ecc94b}}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
h1{font-size:16px;margin:0 8px 0 0}input,select,button{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button{cursor:pointer}#q{min-width:200px;flex:1}
main{display:flex;gap:10px;padding:12px 16px;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 260px;background:rgba(127,127,127,.08);border-radius:8px;padding:8px;min-height:120px}
.col h2{font-size:13px;margin:0 0 8px;display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.card img{width:100%;height:120px;object-fit:cover;display:block;background:var(--line)}
.card .b{padding:8px}.nick{font-weight:600}.mute{color:var(--mute);font-size:12px}
.flag{color:var(--warn);font-size:12px}.price{font-weight:600}
.card a{color:var(--accent)}.card select{width:100%;margin-top:6px;font-size:12px}
.empty{color:var(--mute);font-size:12px;padding:4px}
</style>
</head>
<body>
<header>
<h1>Depa pa la Banda</h1>
<input id="q" type="search" placeholder="" autocomplete="off">
<select id="sort"></select>
<button id="exp"></button><button id="imp"></button>
<input id="file" type="file" accept="application/json" hidden>
<span class="mute" id="count"></span>
</header>
<main id="board"></main>
<script>
const DATA = /*__DEPA_DATA__*/[];
const LANG = (document.documentElement.lang === "es") ? "es" : "en";
const T = {
 en:{search:"Search (accent-insensitive)",newest:"Newest",price:"Price (low to high)",dist:"Distance (near to far)",exp:"Export JSON",imp:"Import JSON",move:"Move to...",open:"Open listing",none:"Nothing here",total:"total",commute:"approx.",bed:"bd",
  stages:{suggested:"Suggested",to_review:"To review",contacted:"Contacted",visit_scheduled:"Visit scheduled",visited:"Visited",finalist:"Finalist",last_resort:"Worse is under a bridge (last resort)",discarded:"Discarded"}},
 es:{search:"Buscar (sin importar acentos)",newest:"Más nuevos",price:"Precio (menor a mayor)",dist:"Distancia (cerca a lejos)",exp:"Exportar JSON",imp:"Importar JSON",move:"Mover a...",open:"Abrir anuncio",none:"Nada aquí",total:"total",commute:"aprox.",bed:"rec",
  stages:{suggested:"Sugeridos",to_review:"Por revisar",contacted:"Contactados",visit_scheduled:"Visita agendada",visited:"Visitados",finalist:"Finalistas",last_resort:"Peor es abajo de un puente",discarded:"Descartados"}}
}[LANG];
const STAGES = Object.keys(T.stages);
let items = DATA.map(x => Object.assign({stage:"suggested"}, x));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const num = v => (typeof v === "number" && isFinite(v)) ? v : (isFinite(parseFloat(v)) ? parseFloat(v) : null);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const $ = id => document.getElementById(id);
$("q").placeholder = T.search; $("exp").textContent = T.exp; $("imp").textContent = T.imp;
$("sort").innerHTML = `<option value="new">${T.newest}</option><option value="price">${T.price}</option><option value="dist">${T.dist}</option>`;

function cmp(a, b, key) {
  if (key === "new") return String(b.posted_on && b.posted_on !== "?" ? b.posted_on : b.found_on || "").localeCompare(String(a.posted_on && a.posted_on !== "?" ? a.posted_on : a.found_on || ""));
  const f = key === "price" ? (x => num(x.total) ?? num(x.price)) : (x => num(x.distance_km));
  const va = f(a), vb = f(b);
  if (va === null && vb === null) return 0; if (va === null) return 1; if (vb === null) return -1;
  return va - vb;
}
function card(x) {
  const flags = (x.scam_flags || []).map(f => `<div class="flag">⚠ ${esc(f)}</div>`).join("");
  const url = safeUrl(x.url), photo = safeUrl(x.photo_url);
  const money = `${esc(x.currency || "")} ${esc(x.price ?? "?")}` + (x.maintenance !== undefined ? ` + ${esc(x.maintenance)}` : "") +
    (num(x.total) !== null ? ` = ${esc(x.total)} ${T.total}` : "");
  const opts = STAGES.map(s => `<option value="${s}"${s === x.stage ? " selected" : ""}>${esc(T.stages[s])}</option>`).join("");
  return `<div class="card" draggable="true" data-id="${esc(x.id)}">` +
    (photo ? `<img src="${esc(photo)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : "") +
    `<div class="b"><div class="nick">${esc(x.nickname || x.title || x.id)}</div>` +
    `<div class="price">${money}</div>` +
    `<div class="mute">${esc(x.neighborhood ?? "?")} · ${esc(x.bedrooms ?? "?")} ${T.bed} · ${T.commute} ${esc(x.travel_min ?? "?")} min</div>` +
    flags + (x.notes ? `<div class="mute">${esc(x.notes)}</div>` : "") +
    (url ? `<div><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${T.open}</a></div>` : "") +
    `<select data-move="${esc(x.id)}" aria-label="${T.move}">${opts}</select></div></div>`;
}
function render() {
  const q = norm($("q").value), key = $("sort").value;
  const shown = items.filter(x => !q || norm(JSON.stringify(x)).includes(q)).sort((a, b) => cmp(a, b, key));
  $("count").textContent = `${shown.length}/${items.length}`;
  $("board").innerHTML = STAGES.map(s => {
    const list = shown.filter(x => x.stage === s);
    return `<section class="col" data-stage="${s}"><h2><span>${esc(T.stages[s])}</span><span>${list.length}</span></h2>` +
      (list.map(card).join("") || `<div class="empty">${T.none}</div>`) + `</section>`;
  }).join("");
}
function move(id, stage) { const x = items.find(i => String(i.id) === String(id)); if (x && STAGES.includes(stage)) { x.stage = stage; render(); } }
$("q").addEventListener("input", render); $("sort").addEventListener("change", render);
$("board").addEventListener("change", e => { if (e.target.dataset.move) move(e.target.dataset.move, e.target.value); });
$("board").addEventListener("dragstart", e => { const c = e.target.closest(".card"); if (c) e.dataTransfer.setData("text/plain", c.dataset.id); });
$("board").addEventListener("dragover", e => e.preventDefault());
$("board").addEventListener("drop", e => { e.preventDefault(); const col = e.target.closest(".col"); if (col) move(e.dataTransfer.getData("text/plain"), col.dataset.stage); });
$("exp").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({listings: items}, null, 2)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "board-export.json"; a.click(); URL.revokeObjectURL(a.href);
});
$("imp").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text()), list = Array.isArray(d) ? d : d.listings;
    list.forEach(n => { const x = items.find(i => String(i.id) === String(n.id)); if (x && STAGES.includes(n.stage)) { x.stage = n.stage; if (n.notes !== undefined) x.notes = n.notes; } });
    render();
  } catch (err) { alert("Invalid JSON file"); }
  e.target.value = "";
});
render();
</script>
</body>
</html>
